<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 - 上海市公共医疗资源服务平台</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
<div id="app" class="page-wrap" v-cloak>
  <div class="auth-card">
    <h2>🏥 用户注册</h2>
    <form @submit.prevent="doRegister">
      <div class="form-item">
        <label>用户名</label>
        <input v-model.trim="username" placeholder="至少3个字符" />
      </div>
      <div class="form-item">
        <label>密码</label>
        <input type="password" v-model.trim="password" placeholder="至少6位" />
      </div>
      <div class="form-item">
        <label>确认密码</label>
        <input type="password" v-model.trim="confirmPwd" placeholder="再输入一次密码" />
      </div>
      <p class="form-error" v-if="error">{{ error }}</p>
      <button class="btn-primary" type="submit">注 册</button>
      <p class="form-tip">已有账号？<a href="login.html">直接登录</a></p>
      <p class="form-tip"><a href="../index.html">← 返回平台主页</a></p>
    </form>
  </div>
</div>
<script>
new Vue({
  el: '#app',
  data: {
    username: '',
    password: '',
    confirmPwd: '',
    error: ''
  },
  methods: {
    doRegister: function () {
      this.error = '';
      if (!this.username || !this.password || !this.confirmPwd) {
        this.error = '请填写完整信息'; return;
      }
      if (this.username.length < 3) {
        this.error = '用户名至少3个字符'; return;
      }
      if (this.password.length < 6) {
        this.error = '密码至少6位'; return;
      }
      if (this.password !== this.confirmPwd) {
        this.error = '两次输入的密码不一致'; return;
      }
      /* 演示：存入本地用户表 */
      var users = JSON.parse(localStorage.getItem('tj_users') || '[]');
      if (users.some(function (u) { return u.username === this.username; }.bind(this))) {
        this.error = '用户名已存在，请换一个'; return;
      }
      users.push({
        username: this.username,
        password: this.password,
        createTime: new Date().toLocaleString()
      });
      localStorage.setItem('tj_users', JSON.stringify(users));
      alert('注册成功，请登录');
      location.href = 'login.html';

      /* ---- 后端联调：B 同学的 /api/user/register 做好后改用 ----
      fetch('http://localhost:3000/api/user/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: this.username, password: this.password })
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (res.code === 0) { alert('注册成功'); location.href = 'login.html'; }
        else { this.error = res.msg || '注册失败'; }
      }.bind(this)).catch(function () { this.error = '后端服务未启动'; }.bind(this));
      ------------------------------------------------------------ */
    }
  }
});
</script>
</body>
</html>
