<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 上海市交通监测平台</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="page-wrap" v-cloak>
  <div class="auth-card">
    <h2>🚦 用户登录</h2>
    <form @submit.prevent="doLogin">
      <div class="form-item">
        <label>用户名</label>
        <input v-model.trim="username" placeholder="请输入用户名" />
      </div>
      <div class="form-item">
        <label>密码</label>
        <input type="password" v-model.trim="password" placeholder="请输入密码" />
      </div>
      <p class="form-error" v-if="error">{{ error }}</p>
      <button class="btn-primary" type="submit">登 录</button>
      <p class="form-tip">还没有账号？<a href="register.html">立即注册</a></p>
      <p class="form-tip"><a href="../index.html">← 返回平台主页</a></p>
    </form>
  </div>
</div>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const username = ref('');
    const password = ref('');
    const error = ref('');

    function doLogin() {
      error.value = '';
      if (!username.value || !password.value) {
        error.value = '用户名和密码不能为空';
        return;
      }
      // 从注册页存好的用户表里查找（演示用本地存储）
      const users = JSON.parse(localStorage.getItem('tj_users') || '[]');
      const user = users.find(u => u.username === username.value);
      if (user && user.password !== password.value) {
        error.value = '密码错误，请重新输入';
        return;
      }
      // 保存登录状态
      localStorage.setItem('tj_username', username.value);
      localStorage.setItem('tj_login_time', new Date().toLocaleString());
      alert('登录成功！');
      location.href = '../index.html';

      /* ---- 后端联调时（B 同学的 /api/user/login 做好后）改用这段： ----
      fetch('http://localhost:3000/api/user/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value })
      }).then(r => r.json()).then(res => {
        if (res.code === 0) {
          localStorage.setItem('tj_username', res.data.username);
          location.href = '../index.html';
        } else {
          error.value = res.msg || '登录失败';
        }
      }).catch(() => { error.value = '后端服务未启动'; });
      --------------------------------------------------------------- */
    }
    return { username, password, error, doLogin };
  }
}).mount('#app');
</script>
</body>
</html>
